apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: db-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: myapp/db-credentials
        property: DB_HOST
    - secretKey: DB_USER
      remoteRef:
        key: myapp/db-credentials
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: myapp/db-credentials
        property: DB_PASSWORD
    - secretKey: DB_NAME
      remoteRef:
        key: myapp/db-credentials
        property: DB_NAME